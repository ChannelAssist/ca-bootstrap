# manifest/folders.yaml — workspace folder structure created by ca-bootstrap.
#
# Each entry creates one folder under the chosen workspace root.
# Folders marked optional are not created unless explicitly requested.
#
# Renames: a folder may optionally declare `renamed_from:` as either a
# scalar (single previous name) or a list (chain of previous names,
# most-recent first). doctor checks each predecessor; repair (and step
# 50) rename the most-recent existing predecessor into the new path
# instead of creating an empty one, so operators who skipped an earlier
# migration still get caught up. Example:
#
#   - path: ca-prototypes
#     renamed_from:
#       - ca-experiments     # most recent
#       - experiments        # oldest

version: 1

# Default workspace folder name (offered as default in the workspace step;
# user can pick a different name).
root_name: ChannelAssistDev

folders:
  - path: ca-tools-repo
    description: ChannelAssist tooling repos (ca-bootstrap and friends)
    renamed_from: ca-tools

  - path: ca-docs-repo
    description: ChannelAssist documentation + org profiles (Keystone, .github)
    renamed_from: ca-docs

  - path: ca-platform-repo
    description: ChannelAssist platform-wide services (ca-* prefix)
    renamed_from: ca-platform

  - path: cm-product-repo
    description: ChannelManager product repos (cm-* prefix)
    renamed_from: cm-product

  - path: ado-legacy-repo
    description: Legacy TFVC checkouts of pre-modernization code (read-only reference)
    optional: true
    renamed_from: ado-legacy

  - path: ca-training-repo
    description: ChannelAssist training material and learning resources
    renamed_from: ca-training

  - path: ca-experiments-repo
    description: Internal experiments / prototypes (opt-in; sparse on disk by default)
    optional: true
    renamed_from:
      - ca-experiments     # most recent
      - experiments        # oldest

  - path: ca-work-dirs-repo
    description: Working directories for Claude Code worktrees, Claude Cowork sessions, and scratch clones
    renamed_from: ca-work-dirs

