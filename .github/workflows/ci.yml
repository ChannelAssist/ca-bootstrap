name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pester:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester + powershell-yaml
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -gt 5.0.0)) {
              Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Install-Module powershell-yaml -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

  doctor-json:
    name: doctor --json (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install powershell-yaml
        shell: pwsh
        run: Install-Module powershell-yaml -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Run doctor in JSON mode
        shell: pwsh
        run: |
          $output = & ./ca-bootstrap.ps1 doctor -Json
          $code = $LASTEXITCODE
          $payload = $output | ConvertFrom-Json
          if (-not $payload.checks)         { throw 'no checks in JSON output' }
          if (-not $payload.schema_version) { throw 'no schema_version' }
          Write-Host "doctor produced $($payload.checks.Count) checks, exit_code=$code"
          if ($code -ne 0 -and $code -ne 2) { throw "unexpected exit code: $code" }
          # Explicit success exit so GH Actions doesn't inherit the inner
          # script's $LASTEXITCODE=2 (which is intentional drift detection).
          exit 0

  shellcheck:
    name: shellcheck bootstrap.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -S error bootstrap.sh scripts/wiki-sync.sh

  cab-tui-pytest:
    name: cab-tui pytest (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install cab-tui (editable + dev extras)
        shell: bash
        working-directory: cab-tui
        run: |
          # Install via pip into the runner's Python so the bridge
          # probe finds it. poetry.lock stays in the repo as the
          # spec-of-record but `poetry install` would create a
          # separate venv that the orchestrator can't see.
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Clear UF_HIDDEN on editable .pth (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Hatchling marks _editable_impl_*.pth with UF_HIDDEN; Python 3.14's
          # site.py skips hidden .pth files. Doesn't affect 3.10/3.12 today
          # but cheap insurance for when CI bumps.
          site_pkgs=$(python -c "import site; print(site.getsitepackages()[0])")
          find "$site_pkgs" -name "_editable_impl_cab_tui.pth" -exec chflags nohidden {} \; 2>/dev/null || true
      - name: Run pytest
        shell: bash
        working-directory: cab-tui
        run: python -m pytest -q

  cab-tui-rpc-pester:
    name: cab-tui RPC bridge Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cab-tui
        shell: bash
        working-directory: cab-tui
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Install Pester + powershell-yaml
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -gt 5.0.0)) {
              Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Install-Module powershell-yaml -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Run TUI-bridge Pester subset
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = @(
            './tests/lib/tui-rpc.tests.ps1',
            './tests/lib/prompts-tui.tests.ps1',
            './tests/lib/setup-tui-events.tests.ps1',
            './tests/lib/setup-recovery.tests.ps1'
          )
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config
