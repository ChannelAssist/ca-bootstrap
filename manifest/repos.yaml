# manifest/repos.yaml — repos to clone, grouped by destination folder.
#
# Field reference (per repo entry):
#   repo                   org/name slug (required)
#   into                   path under workspace root (required)
#   branch                 branch to checkout after clone (default: repo's default)
#   requires_membership    skip silently if user is not a ChannelAssist member
#   large                  warn user about size before cloning
#   warn                   extra message shown alongside the prompt
#   opt_in                 do not clone by default; require explicit yes
#   protocol               'https' or 'ssh' — overrides default_protocol

version: 1
default_protocol: https
clone_concurrency: 4

groups:
  - name: docs
    description: Documentation repos
    repos:
      - { repo: ChannelAssist/Keystone,        into: docs/keystone,             branch: master }
      - { repo: ChannelAssist/.github,         into: docs/org-profile-public,   branch: main }
      - { repo: ChannelAssist/.github-private, into: docs/org-profile-private,  branch: main, requires_membership: true }

  - name: ca-platform
    description: ChannelAssist platform-wide services
    repos:
      - { repo: ChannelAssist/ca-ai-agents,                    into: ca-platform/ca-ai-agents,                    branch: master }
      - { repo: ChannelAssist/ca-claude-plugin,                into: ca-platform/ca-claude-plugin,                branch: main }
      - { repo: ChannelAssist/ca-copilot-plugin,               into: ca-platform/ca-copilot-plugin,               branch: main }
      - { repo: ChannelAssist/ca-data-dictionnary-generator,   into: ca-platform/ca-data-dictionnary-generator,   branch: master }
      - { repo: ChannelAssist/ca-privacy-gate,                 into: ca-platform/ca-privacy-gate,                 branch: main }

  - name: cm-product
    description: ChannelManager product repos
    repos:
      - repo: ChannelAssist/channel-manager
        into: cm-product/channel-manager
        branch: dev
        large: true
        warn: "Legacy monolith — clone is ≈4 GB and can take 10+ minutes."
        opt_in: true
      - { repo: ChannelAssist/cm-claims-validator,     into: cm-product/cm-claims-validator,     branch: dev }
      - { repo: ChannelAssist/cm-contracts,            into: cm-product/cm-contracts,            branch: master }
      - { repo: ChannelAssist/cm-currency-service,     into: cm-product/cm-currency-service,     branch: dev }
      - { repo: ChannelAssist/cm-database-infra,       into: cm-product/cm-database-infra,       branch: main }
      - { repo: ChannelAssist/cm-ledger-service,       into: cm-product/cm-ledger-service,       branch: main }
      - { repo: ChannelAssist/cm-platform-infra,       into: cm-product/cm-platform-infra,       branch: master }
      - { repo: ChannelAssist/cm-purchase-order-service, into: cm-product/cm-purchase-order-service, branch: main }
      - { repo: ChannelAssist/cm-service-template,     into: cm-product/cm-service-template,     branch: master }
      - { repo: ChannelAssist/cm-shared-libs,          into: cm-product/cm-shared-libs,          branch: master }

  - name: learning
    description: Training material and reference repos for upskilling
    repos:
      - { repo: ChannelAssist/nlp-learning-paths,                into: learning/nlp-learning-paths,                branch: main }
      - { repo: ChannelAssist/Generative-AI-for-beginners-dotnet, into: learning/Generative-AI-for-beginners-dotnet, branch: main }
      - { repo: ChannelAssist/desktop-tutorial,                  into: learning/desktop-tutorial,                  branch: dev }

  - name: experiments
    description: Internal experiments / prototypes — opt-in, not part of the default workspace
    repos:
      - { repo: ChannelAssist/blueprint,                  into: experiments/blueprint,                  branch: main, opt_in: true }
      - { repo: ChannelAssist/channel-forge,              into: experiments/channel-forge,              branch: main, opt_in: true }
      - { repo: ChannelAssist/command-center,             into: experiments/command-center,             branch: dev,  opt_in: true }
      - { repo: ChannelAssist/digital-operations-bunker,  into: experiments/digital-operations-bunker,  branch: main, opt_in: true }
      - { repo: ChannelAssist/team-pulse,                 into: experiments/team-pulse,                 branch: main, opt_in: true }
