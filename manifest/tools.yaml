# manifest/tools.yaml — prerequisites and optional tools.
#
# Each tool has a check (how to detect it) and an install spec per OS.
# See docs/manifest-schema.md for the full grammar.

version: 1

required:
  - id: git
    name: Git
    description: Distributed version control
    check:
      cmd: "git --version"
      version_regex: "git version (\\d+\\.\\d+\\.\\d+)"
      min_version: "2.40.0"
    install:
      windows: { type: winget, id: Git.Git }
      macos:   { type: brew,   id: git }
      linux:
        debian: { type: apt, id: git }
        rhel:   { type: dnf, id: git }

  - id: gh
    name: GitHub CLI
    description: GitHub command-line client; used for auth and cloning
    check:
      cmd: "gh --version"
      version_regex: "gh version (\\d+\\.\\d+\\.\\d+)"
      min_version: "2.30.0"
    install:
      windows: { type: winget, id: GitHub.cli }
      macos:   { type: brew,   id: gh }
      linux:
        debian: { type: apt, id: gh, repo_setup: "scripts/install-gh-debian.sh" }
        rhel:   { type: dnf, id: gh }

  - id: pwsh
    name: PowerShell 7+
    description: Cross-platform PowerShell; required to run ca-bootstrap itself
    # First-time install is handled by the bootstrap.sh / bootstrap.ps1
    # entrypoint (chicken/egg — the manifest can't install its own host).
    # The entry below is the doctor-level fallback if pwsh later goes
    # missing; on Linux it assumes the Microsoft package repo is already
    # configured (bootstrap.sh adds it on first run).
    check:
      cmd: "pwsh --version"
      version_regex: "PowerShell (\\d+\\.\\d+\\.\\d+)"
      # Steps declare `#requires -Version 7.0`; aligning min_version
      # with that floor (rather than the previous 7.4.0) so the tool
      # name "PowerShell 7+" matches what doctor enforces.
      min_version: "7.0.0"
    install:
      windows: { type: winget, id: Microsoft.PowerShell }
      macos:   { type: brew,   id: powershell, cask: true }
      linux:
        debian: { type: apt, id: powershell }
        rhel:   { type: dnf, id: powershell }

  - id: make
    name: GNU Make
    description: Build automation; many ChannelAssist repos drive tasks via Makefile
    check:
      cmd: "make --version"
      version_regex: "GNU Make (\\d+\\.\\d+)"
      min_version: "3.81"
    install:
      windows: { type: winget, id: GnuWin32.Make }
      macos:   { type: brew,   id: make }
      linux:
        debian: { type: apt, id: make }
        rhel:   { type: dnf, id: make }

optional:
  - id: dotnet-10
    name: .NET SDK 10
    description: Required for cm-* services and ca-privacy-gate
    needed_by_groups: [cm-product, ca-platform]
    check:
      cmd: "dotnet --list-sdks"
      version_regex: "^(10\\.\\d+\\.\\d+)"
    install:
      windows: { type: winget, id: Microsoft.DotNet.SDK.10 }
      macos:   { type: brew,   id: dotnet-sdk }
      linux:
        any: { type: script, url: "https://dot.net/v1/dotnet-install.sh", args: "--channel 10.0" }

  - id: az
    name: Azure CLI
    description: Azure resource provisioning + Entra app reg management; required by cm-currency-service staging deploy scripts
    needed_by_groups: [cm-product]
    check:
      cmd: "az --version"
      version_regex: "azure-cli\\s+(\\d+\\.\\d+\\.\\d+)"
      min_version: "2.60.0"
    install:
      windows: { type: winget, id: Microsoft.AzureCLI }
      macos:   { type: brew,   id: azure-cli }
      linux:
        debian: { type: script, url: "https://aka.ms/InstallAzureCLIDeb" }
        rhel:   { type: script, url: "https://aka.ms/InstallAzureCLIRhel" }

  - id: kubectl
    name: kubectl
    description: Kubernetes CLI; required for AKS deploys (cm-currency-service staging + future cm-* services on shared AKS)
    needed_by_groups: [cm-product]
    check:
      cmd: "kubectl version --client"
      version_regex: "Client Version:\\s+v(\\d+\\.\\d+\\.\\d+)"
      min_version: "1.28.0"
    install:
      windows: { type: winget, id: Kubernetes.kubectl }
      macos:   { type: brew,   id: kubernetes-cli }
      linux:   { type: snap,   id: kubectl, classic: true }

  - id: helm
    name: Helm
    description: Kubernetes chart deploys; required by `make staging-deploy` and any cm-* service Helm chart
    needed_by_groups: [cm-product]
    check:
      cmd: "helm version --short"
      version_regex: "v(\\d+\\.\\d+\\.\\d+)"
      min_version: "3.10.0"
    install:
      windows: { type: winget, id: Helm.Helm }
      macos:   { type: brew,   id: helm }
      linux:   { type: snap,   id: helm, classic: true }

  - id: jq
    name: jq
    description: JSON parsing in shell; required by cm-currency-service staging scripts (parses `az` / `kubectl` / `gh` JSON output)
    needed_by_groups: [cm-product]
    check:
      cmd: "jq --version"
      version_regex: "jq-(\\d+\\.\\d+)"
      min_version: "1.6"
    install:
      windows: { type: winget, id: jqlang.jq }
      macos:   { type: brew,   id: jq }
      linux:
        debian: { type: apt, id: jq }
        rhel:   { type: dnf, id: jq }

  - id: node-20
    name: Node.js 20 LTS
    description: Required for Keystone (Astro Starlight) and ca-data-dictionnary-generator frontend
    needed_by_groups: [docs, ca-platform]
    check:
      cmd: "node --version"
      version_regex: "v(\\d+)\\."
      min_version: "20"
    install:
      windows: { type: winget, id: OpenJS.NodeJS.LTS }
      macos:   { type: brew,   id: "node@20" }
      linux:   { type: nvm,    version: "20" }

  - id: python-312
    name: Python 3.12
    description: Required for cm-claims-validator and ca-data-dictionnary-generator backend
    needed_by_groups: [cm-product, ca-platform]
    check:
      cmd: "python3 --version"
      version_regex: "Python (\\d+\\.\\d+)"
      min_version: "3.12"
    install:
      windows: { type: winget, id: Python.Python.3.12 }
      macos:   { type: brew,   id: "python@3.12" }
      linux:
        debian: { type: apt, id: "python3.12 python3.12-venv" }
        rhel:   { type: dnf, id: "python3.12" }

  - id: docker
    name: Docker Desktop / Engine
    description: Required for local SQL Server (cm-database-infra) and other containerized services
    check:
      cmd: "docker --version"
      version_regex: "Docker version (\\d+\\.\\d+\\.\\d+)"
    heavy: true
    requires_reboot:  { windows: true,  macos: false, linux: false }
    requires_license: { windows: true,  macos: true,  linux: false }
    install:
      windows: { type: winget, id: Docker.DockerDesktop }
      macos:   { type: brew,   id: docker, cask: true }
      linux:
        any: { type: script, url: "https://get.docker.com", post_install: ["sudo usermod -aG docker $USER"] }

  - id: vscode
    name: Visual Studio Code
    description: Recommended editor; ChannelAssist provides a workspace file
    check:
      cmd: "code --version"
    install:
      windows: { type: winget, id: Microsoft.VisualStudioCode }
      macos:   { type: brew,   id: visual-studio-code, cask: true }
      linux:   { type: snap,   id: code, classic: true }

  - id: vscode-extensions
    name: VS Code recommended extensions
    description: Language support, git tooling, AI assistance
    requires: [vscode]
    install_method: code-cli
    extensions:
      - GitHub.copilot          # inline completions; the chat sibling below resolves ca-copilot-plugin agents/prompts
      - GitHub.copilot-chat     # /<prompt> and @<agent> entry points that consume ca-copilot-plugin content
      - ms-dotnettools.csharp
      - ms-azuretools.vscode-docker
      - ms-python.python
      - dbaeumer.vscode-eslint
      - eamodio.gitlens
      - astro-build.astro-vscode
      - bradlc.vscode-tailwindcss

  - id: claude-code
    name: Claude Code (Anthropic CLI)
    description: AI coding assistant; pairs with the ca-claude-plugin
    requires: [node-20]
    check:
      cmd: "claude --version"
    install:
      windows: { type: npm, id: "@anthropic-ai/claude-code", global: true }
      macos:   { type: npm, id: "@anthropic-ai/claude-code", global: true }
      linux:   { type: npm, id: "@anthropic-ai/claude-code", global: true }

  - id: copilot-cli
    name: GitHub Copilot CLI
    description: Standalone Copilot agent in the terminal (`copilot` binary). Distinct from `gh copilot`.
    # Officially Node 22+, but our manifest's node-20 entry only enforces
    # ≥20. If the user is on Node 20, the npm install will fail with a
    # clear engines warning — they can rerun after upgrading Node.
    requires: [node-20]
    check:
      cmd: "copilot --version"
    install:
      windows: { type: npm, id: "@github/copilot", global: true }
      macos:   { type: npm, id: "@github/copilot", global: true }
      linux:   { type: npm, id: "@github/copilot", global: true }

  - id: gh-copilot
    name: gh copilot extension
    description: Adds `gh copilot suggest` / `gh copilot explain` to the GitHub CLI
    requires: [gh]
    check:
      cmd: "gh copilot --version"
    install:
      windows: { type: gh-extension, id: github/gh-copilot }
      macos:   { type: gh-extension, id: github/gh-copilot }
      linux:   { type: gh-extension, id: github/gh-copilot }

  - id: wsl
    name: WSL2 + Ubuntu 22.04
    description: Linux subsystem for Windows; useful for cm-* services that build cleaner under Linux
    platform: windows-only
    requires_reboot: true
    install:
      windows: { type: command, cmd: "wsl --install -d Ubuntu-22.04" }
